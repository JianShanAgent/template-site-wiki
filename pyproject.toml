[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 改名：demo 换成这个站的 id（平台上的站是「<平台>_<站>」，包名里写成 <平台>-<站>）。要一起改的地方见 README
name = "jianshanagent-site-demo"
version = "0.1.0"
description = "JianShanAgent 站点插件：<这个 wiki 的名字>"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# 只依赖核心：各个 wiki 平台（灰机、BWiki）的东西核心自己带着，0.3.0 起
dependencies = ["jianshanagent>=0.3.0"]

# 登记成站点插件：名字是插件 id，值是包路径
[project.entry-points."jianshanagent.sites"]
demo = "jianshanagent_site_demo"

[tool.hatch.build.targets.wheel]
packages = ["src/jianshanagent_site_demo"]

# 开发时用旁边目录里的核心（几个仓库并排放在同一个目录下）
[tool.uv.sources]
jianshanagent = { path = "../agent-core", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
