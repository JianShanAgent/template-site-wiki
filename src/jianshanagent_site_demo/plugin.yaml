# 插件清单（格式见核心仓库 agent-core 的 docs/插件规范.md）
id: demo                   # 和 pyproject.toml 里登记的名字一样。平台上的站以「平台的 id_」开头，如 huiji_demo
kind: site
name: 示例 wiki
description: <一两句话：这个 wiki 是什么，这个插件管它的哪些特有的东西>
# platform: huiji          # 建在哪个 wiki 平台上（核心带着的有 huiji、bwiki）。自己架的 MediaWiki 站不写这一行
capabilities:
  - wiki        # 查询：这个站自己的条目、别名（wiki.py）
  - knowledge   # 知识库：这个站自己的内容（knowledge.py）
  - extend      # 对通用配置的补充（config.yaml 的 extend 段）
